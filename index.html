<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire-Tech Pro - JVOLT Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { fireRed: '#dc2626', darkNavy: '#0f172a', jvoltBlue: '#0284c7' }
                }
            }
        }
    </script>
    <style>
        @keyframes badge-blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.96); } }
        .badge-blink { animation: badge-blink 1.2s infinite ease-in-out; }
        @keyframes slide-up { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.25s ease-out forwards; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-red-600 selection:text-white relative">

    <!-- BOTÓN DE SINCRONIZACIÓN MANUAL -->
    <button onclick="globalForceSync()" class="fixed bottom-6 left-6 z-[150] bg-blue-600 hover:bg-blue-700 text-white font-bold p-4 rounded-full shadow-2xl flex items-center justify-center border-2 border-blue-400 transition transform hover:scale-105" title="Sincronizar Cloud Ahora">
        <i class="fa-solid fa-rotate text-xl animate-spin"></i>
    </button>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-5 right-5 z-[100] hidden items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border transition-all duration-300 transform translate-y-10 opacity-0">
        <i id="toastIcon" class="fa-solid fa-circle-check text-lg"></i>
        <span id="toastMsg" class="text-sm font-bold">Mensaje</span>
    </div>

    <!-- LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-3">
                <div class="inline-flex bg-white px-4 py-2 rounded-xl shadow-lg items-center justify-center">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-blue-700 to-cyan-300 flex items-center justify-center">
                            <span class="text-white font-serif font-bold text-sm italic">J</span>
                        </div>
                        <span class="text-lg font-black text-slate-900 font-serif">VOLT</span>
                    </div>
                </div>
                <h1 class="text-xl font-black text-white tracking-wide">FIRE-TECH <span class="text-red-500">PRO</span></h1>
                <p class="text-xs text-slate-400">Soporte Técnico Cloud: <strong>contacto@jvolt.cl</strong></p>
            </div>

            <div class="bg-slate-800/60 border border-slate-700/60 p-3 rounded-xl space-y-2 text-xs">
                <p class="font-bold text-slate-300 text-[10px] uppercase tracking-wider">Accesos Rápidos Cloud:</p>
                <div class="grid grid-cols-2 gap-1.5 font-mono text-[10px]">
                    <button type="button" onclick="fillCreds('contacto@jvolt.cl', 'admin123')" class="text-left bg-slate-900/80 hover:bg-slate-900 p-2 rounded border border-slate-700 transition text-red-400 truncate">
                        <strong>Admin:</strong> contacto@jvolt.cl
                    </button>
                    <button type="button" onclick="fillCreds('operaciones@jvolt.cl', 'ops123')" class="text-left bg-slate-900/80 hover:bg-slate-900 p-2 rounded border border-slate-700 transition text-slate-300 truncate">
                        <strong>Ops:</strong> operaciones@jvolt.cl
                    </button>
                    <button type="button" onclick="fillCreds('jorge@jvolt.cl', 'tec123')" class="text-left bg-slate-900/80 hover:bg-slate-900 p-2 rounded border border-slate-700 transition text-emerald-400 truncate">
                        <strong>Técnico:</strong> jorge@jvolt.cl
                    </button>
                    <button type="button" onclick="fillCreds('ID00017', 'cliente123')" class="col-span-2 text-left bg-blue-900/40 hover:bg-blue-900/60 p-2 rounded border border-blue-800 transition text-blue-300 text-center">
                        <strong>Cliente:</strong> ID00017 / cliente123
                    </button>
                </div>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Correo / Usuario</label>
                    <input type="text" id="loginEmail" placeholder="ej: contacto@jvolt.cl" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-red-500">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm">
                    Ingresar al Sistema Cloud
                </button>
            </form>
            <div id="loginError" class="text-xs text-red-400 text-center hidden font-medium">Credenciales incorrectas.</div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="appContainer" class="hidden flex-1 flex flex-col min-h-screen">
        <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-40 px-4 py-3 shadow-md">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-white px-2.5 py-1 rounded-xl flex items-center gap-2 shadow">
                        <span class="text-sm font-black text-slate-900 font-serif">JVOLT</span>
                    </div>
                    <h1 class="text-sm font-black text-white">FIRE-TECH <span class="text-red-500">PRO</span> <span class="text-[10px] text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800 ml-2">LIVE CLOUD</span></h1>
                </div>
                <div class="flex items-center gap-3">
                    <span id="sessionRoleTitle" class="text-xs font-bold text-slate-200">Rol</span>
                    <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-xl border border-slate-700">Salir</button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h2 class="text-sm font-bold text-white uppercase tracking-wider"><i class="fa-solid fa-table-list text-red-500 mr-2"></i> Bitácora General de Taller</h2>
                <button onclick="openNewVehicleModal()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow"><i class="fa-solid fa-plus mr-1"></i> Ingresar Equipo</button>
            </div>
            <div id="vehiclesList" class="grid grid-cols-1 gap-6"></div>
        </main>
    </div>

    <!-- MODAL NUEVO EQUIPO -->
    <div id="modalNewVehicle" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-white text-sm">Ingreso Cloud de Equipo</h3>
                <button onclick="closeNewVehicleModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="saveNewVehicle(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-300 font-bold mb-1">Patente / Ficha *</label>
                    <input type="text" id="nvPlate" placeholder="Ej: CL-4920" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 font-bold mb-1">Modelo / Tipo *</label>
                    <input type="text" id="nvModel" placeholder="Ej: Camión Magirus BT" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 font-bold mb-1">Motivo / Falla *</label>
                    <textarea id="nvFault" rows="2" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeNewVehicleModal()" class="px-4 py-2 bg-slate-700 text-white rounded-xl">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-xl font-bold">Guardar y Sincronizar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCB9-IGgFbHOL5-RVTO4ZsGc4Cu7XK5n0",
            authDomain: "jvolt-taller.firebaseapp.com",
            projectId: "jvolt-taller",
            storageBucket: "jvolt-taller.firebasestorage.app",
            messagingSenderId: "826178922148",
            appId: "1:826178922148:web:af882aa8dea1e135c3a831",
            measurementId: "G-1HGSFN267D"
        };

        let db, auth;
        const defaultState = {
            users: [
                { email: 'contacto@jvolt.cl', pass: 'admin123', name: 'Administrador Principal JVOLT', role: 'admin' },
                { email: 'operaciones@jvolt.cl', pass: 'ops123', name: 'Jefe de Operaciones Taller', role: 'ops' },
                { email: 'jorge@jvolt.cl', pass: 'tec123', name: 'Jorge Marín (Técnico 1)', role: 'tech' },
                { email: 'ID00017', pass: 'cliente123', name: 'Compañía de Bomberos Antofagasta', role: 'client' }
            ],
            vehicles: [
                { id: 1, plate: 'CL-4920', model: 'Camión Magirus BT', fault: 'Falla en sistema de bombeo', status: 'En Proceso', progress: 45 }
            ]
        };

        window.appState = defaultState;
        window.currentUser = null;

        async function init() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await signInAnonymously(auth);

                const docRef = doc(db, 'jvolt_taller', 'conexion');
                const snap = await getDoc(docRef);
                if (snap.exists() && snap.data().state) {
                    window.appState = snap.data().state;
                } else {
                    await setDoc(docRef, { state: window.appState, updatedAt: new Date().toISOString() });
                }

                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists() && docSnap.data().state) {
                        window.appState = docSnap.data().state;
                        if (window.currentUser) renderApp();
                    }
                });
            } catch(e) {
                console.log("Modo local", e);
            }
        }

        window.syncToCloud = async function() {
            if (!db) return;
            try {
                const docRef = doc(db, 'jvolt_taller', 'conexion');
                await setDoc(docRef, { state: window.appState, updatedAt: new Date().toISOString() });
                showToast("Sincronizado en la nube", "success");
            } catch(e) {
                showToast("Error al sincronizar", "warning");
            }
        };

        window.globalForceSync = async function() {
            if (!db) return;
            const docRef = doc(db, 'jvolt_taller', 'conexion');
            const snap = await getDoc(docRef);
            if (snap.exists() && snap.data().state) {
                window.appState = snap.data().state;
                if (window.currentUser) renderApp();
                showToast("¡Sincronizado con éxito desde la nube!", "success");
            }
        };

        window.showToast = function(msg, type='success') {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.className = `fixed bottom-5 right-5 z-[100] flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border ${type==='success'?'bg-emerald-900 border-emerald-600 text-white':'bg-amber-900 border-amber-600 text-white'}`;
            t.style.display = 'flex';
            setTimeout(() => t.style.display = 'none', 3000);
        };

        window.fillCreds = function(e, p) {
            document.getElementById('loginEmail').value = e;
            document.getElementById('loginPassword').value = p;
        };

        window.handleLogin = function(ev) {
            ev.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const u = window.appState.users.find(x => x.email.toLowerCase() === email.toLowerCase() && x.pass === pass);
            if (u) {
                window.currentUser = u;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                renderApp();
                showToast(`Bienvenido ${u.name}`);
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        };

        window.handleLogout = function() {
            window.currentUser = null;
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        };

        window.renderApp = function() {
            document.getElementById('sessionRoleTitle').innerText = `${window.currentUser.name} (${window.currentUser.role.toUpperCase()})`;
            const list = document.getElementById('vehiclesList');
            list.innerHTML = '';
            window.appState.vehicles.forEach(v => {
                list.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-white">${v.model} (${v.plate})</h3>
                            <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-2.5 py-1 rounded-lg font-bold">${v.status}</span>
                        </div>
                        <p class="text-xs text-slate-300"><strong>Falla:</strong> ${v.fault}</p>
                        <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-700">
                            <div class="bg-emerald-500 h-full" style="width: ${v.progress}%"></div>
                        </div>
                    </div>
                `;
            });
        };

        window.openNewVehicleModal = function() { document.getElementById('modalNewVehicle').classList.remove('hidden'); };
        window.closeNewVehicleModal = function() { document.getElementById('modalNewVehicle').classList.add('hidden'); };

        window.saveNewVehicle = function(e) {
            e.preventDefault();
            window.appState.vehicles.unshift({
                id: Date.now(),
                plate: document.getElementById('nvPlate').value.trim(),
                model: document.getElementById('nvModel').value.trim(),
                fault: document.getElementById('nvFault').value.trim(),
                status: 'Pendiente',
                progress: 0
            });
            syncToCloud();
            closeNewVehicleModal();
            renderApp();
        };

        init();
    </script>
</body>
</html>
