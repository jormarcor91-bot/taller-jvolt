            projectId: "jvolt-taller",

        };

        let db, auth;
        const defaultState = {
            users: [
                { email: 'contacto@jvolt.cl', pass: 'admin123', name: 'Administrador Principal JVOLT', role: 'admin' },
                { email: 'operaciones@jvolt.cl', pass: 'ops123', name: 'Jefe de Operaciones Taller', role: 'ops' },
                { email: 'jorge@jvolt.cl', pass: 'tec123', name: 'Jorge Marín (Técnico 1)', role: 'tech' },
                { email: 'hector@jvolt.cl', pass: 'tec123', name: 'Héctor Campins (Técnico 2)', role: 'tech' },
                { email: 'ID00017', pass: 'cliente123', name: 'Compañía de Bomberos Antofagasta', role: 'client' }
            ],
            vehicles: [
                {
                    id: 1,
                    clientId: 'ID00017', 
                    dateIn: '2026-10-20',
                    plate: 'CL-4920',
                    vin: '1H9V4421',
                    model: 'Camión Magirus BT',
                    fault: 'Falla en componente motor, baja presión.',
                    status: 'En Proceso', 
                    techAssigned: 'jorge@jvolt.cl',
                    techName: 'Jorge Marín (Técnico 1)',
                    commercialStatus: 'Aprobado - OC',
                    quoteNum: 'COT-2026-102',
                    ocNum: 'OC-99823',
                    factNum: '',
                    hh: 36,
                    parts: [
                        { id: 101, name: 'Bomba centrífuga 1250', status: 'arribado' },
                        { id: 102, name: 'Sellos mecánicos', status: 'espera' }
                    ],
                    serviceSteps: [
                        { id: 1001, text: 'desmontaje de ruedas', completed: true },
                        { id: 1002, text: 'cambio de frenos', completed: true }
                    ],
                    assignedProcedures: ['jvoltps1110'],

                    techNotes: 'Se revisó la bomba centrífuga.',
                    chat: [{ sender: 'operaciones@jvolt.cl', roleName: 'Operaciones', text: 'Técnico asignado.', time: '09:00' }],
                    unreadAdmin: false,
                    unreadOps: false,
                    unreadTechNote: true,
                    updateRequested: false
                }
            ],
            clients: [
                { id: 'ID00017', name: 'Compañía de Bomberos Antofagasta', rut: '70.123.456-K', contact: 'contacto@bomberos.cl' },
                { id: 'ID00022', name: 'Minera Escondida Ltda.', rut: '76.987.321-2', contact: 'talleres@minera.cl' }
            ],
            majorParts: [
                { id: 1, name: 'Válvula Akron Brass G2', type: 'Internacional', plate: 'CL-4920', status: 'transito', details: 'Solicitado en origen USA' }
            ],
            procedures: [
                { id: 'p1', code: 'jvoltps1110', desc: 'Mantención Mayor Sistema de Bombeo BT' },
                { id: 'p2', code: 'jvoltps1125', desc: 'Revisión y Certificación de Frenos ABS' }
            ]
        };

        let savedLocalState = localStorage.getItem('jvolt_master_state');
        window.appState = savedLocalState ? JSON.parse(savedLocalState) : defaultState;
        window.currentUser = null;

        // INICIALIZACIÓN NO BLOQUEANTE
        async function initFirebase() {
            const splash = document.getElementById('splashScreen');
            const login = document.getElementById('loginScreen');

            const hideSplash = () => {
                if (splash && splash.style.display !== 'none') {
                    splash.classList.add('fade-out-splash');
                    setTimeout(() => {
                        splash.style.display = 'none';
                        if (login) login.classList.remove('hidden');
                    }, 800);
                }
            };

            // Forzar apertura de la app tras 1.5 segundos máximo pase lo que pase con la nube
            setTimeout(hideSplash, 1500);

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                signInAnonymously(auth).catch(() => {});

                const docRef = doc(db, 'jvolt_taller', 'conexion');
                const snap = await getDoc(docRef);
                
                if (snap.exists() && snap.data().state) {
                    window.appState = snap.data().state;
                    localStorage.setItem('jvolt_master_state', JSON.stringify(window.appState));
                }

                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists() && docSnap.data().state) {
                        window.appState = docSnap.data().state;
                        localStorage.setItem('jvolt_master_state', JSON.stringify(window.appState));
                        if (window.currentUser) renderApp();
                    }
                });
            } catch (e) {
                console.debug("Modo local activo");
            }
        }

        window.syncToCloud = async function() {
            localStorage.setItem('jvolt_master_state', JSON.stringify(window.appState));
            if (!db) return;
            try {
                const docRef = doc(db, 'jvolt_taller', 'conexion');
                await setDoc(docRef, { state: window.appState, updatedAt: new Date().toISOString() });
                showToast("Sincronizado en la nube", "success");
            } catch(err) {
                console.debug("Sync error");
            }
        };

        window.globalForceSync = async function() {
            if (!db) { showToast("Modo local activo", "warning"); return; }
            try {
                const docRef = doc(db, 'jvolt_taller', 'conexion');
                const snap = await getDoc(docRef);
                if (snap.exists() && snap.data().state) {
                    window.appState = snap.data().state;
                    localStorage.setItem('jvolt_master_state', JSON.stringify(window.appState));
                    if (window.currentUser) renderApp();
                    showToast("¡Sincronizado con éxito desde la nube!", "success");
                }
            } catch(e) {
                showToast("Error al sincronizar", "warning");
            }
        };

        window.showToast = function(msg, type='success') {
            const t = document.getElementById('toast');
            if(!t) return;
            document.getElementById('toastMsg').innerText = msg;
            t.className = `fixed bottom-5 right-5 z-[100] flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border ${type==='success'?'bg-emerald-900 border-emerald-600 text-white':'bg-amber-900 border-amber-600 text-white'}`;
            t.style.display = 'flex';
            setTimeout(() => t.style.display = 'none', 3000);
        };

        window.fillCreds = function(e, p) {
            document.getElementById('loginEmail').value = e;
            document.getElementById('loginPassword').value = p;
        };

        window.handleLogin = function(ev) {
            ev.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const u = window.appState.users.find(x => x.email.toLowerCase() === email.toLowerCase() && x.pass === pass);
            if (u) {
                window.currentUser = u;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                renderApp();
                showToast(`Bienvenido ${u.name}`);
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        };

        window.handleLogout = function() {
            window.currentUser = null;
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        };

        window.renderApp = function() {
            const roleTitle = document.getElementById('sessionRoleTitle');
            if (roleTitle && window.currentUser) {
                roleTitle.innerText = `${window.currentUser.name} (${window.currentUser.role.toUpperCase()})`;
            }
            const list = document.getElementById('vehiclesList');
            if (!list) return;
            list.innerHTML = '';
            window.appState.vehicles.forEach(v => {
                list.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-white">${v.model} (${v.plate})</h3>
                            <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-2.5 py-1 rounded-lg font-bold">${v.status}</span>
                        </div>
                        <p class="text-xs text-slate-300"><strong>Falla:</strong> ${v.fault}</p>
                        <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-700">
                            <div class="bg-emerald-500 h-full" style="width: ${v.progress}%"></div>
                        </div>
                    </div>
                `;
            });
        };

        initFirebase();
    </script>
