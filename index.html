<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire-Tech Pro - Cloud Sync JVOLT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { fireRed: '#dc2626', darkNavy: '#0f172a', jvoltBlue: '#0284c7' } } } }
    </script>
    <style>
        @keyframes badge-blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.96); } }
        .badge-blink { animation: badge-blink 1.2s infinite ease-in-out; }
        @keyframes slide-up { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.25s ease-out forwards; }
        @keyframes fade-out { from { opacity: 1; visibility: visible; } to { opacity: 0; visibility: hidden; } }
        .fade-out-splash { animation: fade-out 0.8s ease-in-out forwards; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-red-600 selection:text-white relative">

    <div id="toast" class="fixed bottom-5 right-5 z-[100] hidden items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border transition-all duration-300 transform translate-y-10 opacity-0">
        <i id="toastIcon" class="fa-solid fa-circle-check text-lg"></i>
        <span id="toastMsg" class="text-sm font-bold">Mensaje</span>
    </div>

    <!-- PANTALLA DE PRESENTACIÓN -->
    <div id="splashScreen" class="fixed inset-0 bg-slate-950 z-[200] flex flex-col items-center justify-center p-4 space-y-6 transition-opacity duration-700">
        <div class="bg-slate-900/90 border border-slate-800 p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-md w-full space-y-6 text-center">
            <div class="bg-white p-3 rounded-2xl shadow-xl flex items-center justify-center border border-slate-700 w-full">
                <div class="flex items-center gap-3 py-1">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-700 via-blue-500 to-cyan-300 shadow-lg flex items-center justify-center border-2 border-blue-400 shrink-0">
                        <span class="text-white font-serif font-bold text-2xl italic">J</span>
                    </div>
                    <div class="text-left">
                        <div class="text-2xl font-black tracking-wider text-slate-900 font-serif leading-none">VOLT</div>
                        <div class="text-[8px] font-bold tracking-widest text-slate-600 uppercase mt-0.5">GENERAL SUPPORT & SERVICE</div>
                    </div>
                </div>
            </div>
            <div class="space-y-1">
                <h1 class="text-2xl font-black text-white tracking-wide">FIRE-TECH <span class="text-red-500">PRO</span></h1>
                <p class="text-xs text-slate-400">Sincronización Cloud Global</p>
            </div>
            <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800 p-0.5">
                <div id="splashBar" class="bg-gradient-to-r from-blue-600 to-red-600 h-full rounded-full transition-all duration-[1000ms] w-0"></div>
            </div>
            <p id="syncStatusText" class="text-[10px] text-emerald-400 font-mono">Conectando...</p>
        </div>
    </div>

    <!-- PANTALLA DE LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-3">
                <h1 class="text-xl font-black text-white tracking-wide">FIRE-TECH <span class="text-red-500">PRO</span></h1>
                <p class="text-xs text-slate-400">Soporte Técnico Cloud</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/60 p-3 rounded-xl space-y-2 text-xs">
                <p class="font-bold text-slate-300 text-[10px] uppercase">Accesos Rápidos:</p>
                <div class="grid grid-cols-2 gap-1.5 font-mono text-[10px]">
                    <button type="button" onclick="fillCreds('contacto@jvolt.cl', 'admin123')" class="text-left bg-slate-900 p-2 rounded border border-slate-700 text-red-400 truncate">Admin</button>
                    <button type="button" onclick="fillCreds('jorge@jvolt.cl', 'tec123')" class="text-left bg-slate-900 p-2 rounded border border-slate-700 text-emerald-400 truncate">Técnico</button>
                </div>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Correo / Usuario</label>
                    <input type="text" id="loginEmail" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Contraseña</label>
                    <input type="password" id="loginPassword" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm">Ingresar</button>
            </form>
            <div id="loginError" class="text-xs text-red-400 text-center hidden font-medium">Credenciales incorrectas.</div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="appContainer" class="hidden flex-1 flex flex-col min-h-screen">
        <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-40 px-4 py-3 shadow-md">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <h1 class="text-sm font-black text-white">FIRE-TECH <span class="text-red-500">PRO</span></h1>
                <button onclick="handleLogout()" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-xl border border-slate-700">Salir</button>
            </div>
        </header>
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
            <div id="vehiclesList" class="grid grid-cols-1 gap-6"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCB9-IGgFbHOL5-RVTO4ZsGc4Cu7XK5n0",
            authDomain: "jvolt-taller.firebaseapp.com",
            projectId: "jvolt-taller",
            storageBucket: "jvolt-taller.firebasestorage.app",
            messagingSenderId: "826178922148",
            appId: "1:826178922148:web:af882aa8dea1e135c3a831",
            measurementId: "G-1HGSFN267D"
        };

        let app, db, auth;
        window.appState = {
            users: [
                { email: 'contacto@jvolt.cl', pass: 'admin123', name: 'Administrador Principal JVOLT', role: 'admin' },
                { email: 'jorge@jvolt.cl', pass: 'tec123', name: 'Jorge Marín (Técnico 1)', role: 'tech' }
            ],
            vehicles: []
        };
        window.currentUser = null;

        async function initFirebase() {
            let done = false;
            const openLogin = () => {
                if (done) return;
                done = true;
                const splash = document.getElementById('splashScreen');
                if(splash) {
                    splash.style.display = 'none';
                    document.getElementById('loginScreen').classList.remove('hidden');
                }
            };
            setTimeout(openLogin, 1500);

            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await signInAnonymously(auth);
                
                const docRef = doc(db, 'jvolt_taller_data', 'master_state');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data && data.state) {
                            window.appState = data.state;
                        }
                    } else {
                        setDoc(docRef, { state: window.appState });
                    }
                    openLogin();
                }, () => openLogin());
            } catch(e) {
                openLogin();
            }
        }

        window.fillCreds = (e, p) => {
            document.getElementById('loginEmail').value = e;
            document.getElementById('loginPassword').value = p;
        };

        window.handleLogin = (e) => {
            e.preventDefault();
            const id = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const found = window.appState.users.find(u => u.email.toLowerCase() === id.toLowerCase() && u.pass === pass);
            if (found) {
                window.currentUser = found;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        };

        window.handleLogout = () => {
            window.currentUser = null;
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        };

        initFirebase();
    </script>
</body>
</html>
